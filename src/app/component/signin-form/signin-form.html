<div class="containe">
  <div class="d-flex bang">
    <div class="Auth">
      <!-- <img src="/content/images/zamani.png" /> -->
      <h1 data-cy="loginTitle">Authentification</h1>
      <!-- @if (authenticationError()) {
        <div class="alert alert-danger" data-cy="loginError">
          <strong>Erreur d&apos;authentification !</strong> Veuillez vérifier vos identifiants de connexion.
        </div>
      } -->
      <form class="form" (ngSubmit)="login()" [formGroup]="loginForm">
        <div class="mb-3 text-center">
          <label class="username-label" for="username">Nom d&apos;utilisateur</label>
          <input
            type="text"
            class="form-control"
            name="username"
            id="username"
            placeholder="Votre nom d'utilisateur"
            formControlName="username"
            #username
            data-cy="username"
          />
        </div>

        <div class="mb-3 text-center">
          <label for="password">Mot de passe</label>
          <input
            type="password"
            class="form-control"
            name="password"
            id="password"
            placeholder="Votre mot de passe"
            formControlName="password"
            data-cy="password"
          />
        </div>

        <div class="form-check text-center">
          <label class="form-check-label" for="rememberMe">
            <input class="form-check-input" type="checkbox" name="rememberMe" id="rememberMe" formControlName="rememberMe" />
            <span>Garder la session ouverte</span>
          </label>
        </div>
        <div class="text-center">
          <button type="submit" class="btn btn-primary" data-cy="submit">Connexion</button>
        </div>
      </form>
      <!-- <div class="mt-3 alert alert-warning">
        <a class="alert-link" routerLink="/account/reset/request" data-cy="forgetYourPasswordSelector">
          Avez-vous oublié votre mot de passe ?
        </a>
      </div> -->

      <div class="alert alert-warning text-center">
        <p id="question">Vous n&apos;avez pas encore de compte ? <br /></p>
        <a class="alert-link" routerLink="/account/register">Créer un compte</a>
      </div>
    </div>
    <div class="Picture">
      <!-- <img src="../../content/images/a-filigrane.png" alt="" class="pic" /> -->
      <!-- <img src="../../content/images/fauteuil.jpg" alt="" class="pic" /> -->
    </div>
  </div>
</div>
