<div class="min-h-screen bg-gray-50">
  <header class="bg-white border-b border-border-color sticky top-0 z-50 shadow-sm">
    <nav class="max-w-[1760px] mx-auto px-10 py-5 flex justify-between items-center">
      <div class="flex items-center gap-2 text-2xl font-bold text-primary">
        <img src="Logo_0.png" alt="" class="w-16 h-16">
        BestBNB - Messagerie
      </div>
      <a href="/" class="text-dark-gray text-sm font-medium px-4 py-2 rounded-full hover:bg-gray-50 transition">
        ← Retour à l'accueil
      </a>
    </nav>
  </header>

  <div class="max-w-[1760px] mx-auto p-4 md:p-10">
    <div class="bg-white rounded-2xl shadow-lg overflow-hidden" style="height: calc(100vh - 200px);">
      <div class="h-full grid grid-cols-1 md:grid-cols-3">
        <div class="border-r border-border-color">
          <app-conversation-list
            (conversationSelected)="onConversationSelected($event)">
          </app-conversation-list>
        </div>
        <div class="md:col-span-2">
          <app-message-thread [conversationId]="selectedConversationId">
          </app-message-thread>
        </div>
      </div>
    </div>
  </div>
</div>
