   <div class="popup-backdrop" (click)="close.emit()">
     <div class="popup" (click)="$event.stopPropagation()">
       <h2>{{ isEdit ? 'Edit Listing' : 'Create Listing' }}</h2>
   
       <form name="form" (ngSubmit)="save()" [formGroup]="listingForm" class="grid grid-cols-1 md:grid-cols-2 gap-6">
         <label class="form-label block text-gray-700 font-semibold mb-2" for="title">Titre</label>
         <input type="text" placeholder="Title" formControlName="title" name="title" required />

         <label class="form-label block text-gray-700 font-semibold mb-2" for="description">Description</label>
         <input type="text" placeholder="Description" formControlName="description" name="description" />

         <label class="form-label block text-gray-700 font-semibold mb-2" for="city">City</label>
         <input type="text" placeholder="City" formControlName="city" name="city" required />

         <label class="form-label block text-gray-700 font-semibold mb-2" for="city">Country</label>
         <input type="text" placeholder="Country" formControlName="country" name="country" required />

         <label class="form-label block text-gray-700 font-semibold mb-2" for="address">Address</label>
         <input type="text" placeholder="Address" formControlName="address" name="address" required />

         <label class="form-label block text-gray-700 font-semibold mb-2" for="postal">Postal</label>
         <input type="text" placeholder="Postal" formControlName="postal" name="postal" />

         <label class="form-label block text-gray-700 font-semibold mb-2" for="price">Prix</label>
         <input type="number" placeholder="Price" formControlName="price" name="price" required />

         <label class="form-label block text-gray-700 font-semibold mb-2" for="max">Max Guests</label>
         <input type="number" placeholder="Max Guests" formControlName="max" name="max" required />

         <label class="form-label block text-gray-700 font-semibold mb-2" for="size">Size</label>
         <input type="number" placeholder="Size" formControlName="size" name="size" required />
   
         <div class="actions">
           <button type="submit">Save</button>
           <button type="button" class="cancel" (click)="close.emit()">Cancel</button>
         </div>
       </form>
     </div>
   </div>
