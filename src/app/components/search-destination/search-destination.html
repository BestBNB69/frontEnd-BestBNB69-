<div class="bg-white p-6 rounded-2xl shadow-2xl flex flex-wrap gap-4 justify-center">
  <div class="flex-1 min-w-[200px]">
    <label class="block text-xs font-semibold mb-2 text-dark-gray">Destination</label>
    <input type="text" placeholder="Où allez-vous ?" class="w-full px-3 py-3 border border-light-gray rounded-lg text-sm outline-none focus:border-primary transition">
  </div>
  <div class="flex-1 min-w-[200px]">
    <label class="block text-xs font-semibold mb-2 text-dark-gray">Arrivée</label>
    <input type="date" class="w-full px-3 py-3 border border-light-gray rounded-lg text-sm outline-none focus:border-primary transition">
  </div>
  <div class="flex-1 min-w-[200px]">
    <label class="block text-xs font-semibold mb-2 text-dark-gray">Départ</label>
    <input type="date" class="w-full px-3 py-3 border border-light-gray rounded-lg text-sm outline-none focus:border-primary transition">
  </div>
  <div class="flex-1 min-w-[200px]">
    <label class="block text-xs font-semibold mb-2 text-dark-gray">Voyageurs</label>
    <select class="w-full px-3 py-3 border border-light-gray rounded-lg text-sm outline-none focus:border-primary transition">
      <option>1 voyageur</option>
      <option>2 voyageurs</option>
      <option>3 voyageurs</option>
      <option>4+ voyageurs</option>
    </select>
  </div>
  <button class="bg-primary hover:bg-primary-dark text-white px-8 py-3 rounded-lg text-base font-semibold transition transform hover:scale-105 self-end">
    Rechercher
  </button>
</div>
