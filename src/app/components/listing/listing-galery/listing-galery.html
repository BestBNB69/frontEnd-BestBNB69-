<div class="mb-12 relative">
  @if (images && images.length > 0) {
    <div class="grid grid-cols-4 grid-rows-2 gap-2 rounded-xl overflow-hidden h-[400px]">
      <div class="col-span-2 row-span-2 relative group cursor-pointer">
        <img [src]="images[0]" class="w-full h-full object-cover hover:brightness-95 transition"/>
      </div>
      @for (img of images.slice(1, 5); track $index) {
        <div class="relative group cursor-pointer">
          <img [src]="img" class="w-full h-full object-cover hover:brightness-95 transition"/>
        </div>
      }
    </div>
    <button class="absolute bottom-6 right-6 bg-white border border-gray-900 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-gray-50 transition flex items-center gap-2 shadow-md">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
      </svg>
      Afficher toutes les photos
    </button>
  }
</div>
