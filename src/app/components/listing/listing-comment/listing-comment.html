<div class="mt-12 pt-12 border-t border-gray-200">
  <!-- Header -->
  <div class="flex items-center gap-2 mb-8">
    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
      <path
        d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
    </svg>
    <h3 class="text-[22px] font-semibold">
      {{ averageRating }} · {{ comments.length }} commentaires
    </h3>
  </div>

  <div class="mb-6 border p-4 rounded-lg bg-gray-50">
    <h3 class="font-semibold mb-2">Leave a Review</h3>

    <form (ngSubmit)="submitComment()" #commentForm="ngForm">
      <!-- Rating -->
      <div class="flex items-center gap-1 mb-2">
        <ng-container *ngFor="let star of [1,2,3,4,5]">
          <svg (click)="selectedRating = star" [class.text-yellow-400]="star <= selectedRating"
            [class.text-gray-300]="star > selectedRating" class="w-5 h-5 cursor-pointer" fill="currentColor"
            viewBox="0 0 20 20">
            <path
              d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
          </svg>
        </ng-container>
      </div>

      <!-- Comment text -->
      <textarea name="content" [(ngModel)]="newComment" rows="3" placeholder="Write your review..."
        class="w-full border p-2 rounded mb-2" required>
    </textarea>

      <button type="submit" [disabled]="!newComment || !selectedRating"
        class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">
        Submit
      </button>
    </form>
  </div>


  <!-- Loading -->
  <div *ngIf="loading" class="text-gray-500">Loading comments...</div>

  <!-- Comments grid -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-x-16 gap-y-10" *ngIf="!loading">
    <div *ngFor="let comment of comments">
      <!-- User -->
      <div class="flex items-center gap-3 mb-3">
        <div class="w-10 h-10 rounded-full bg-gray-300 flex items-center justify-center text-sm font-semibold">
          {{ comment.userId.slice(0, 2).toUpperCase() }}
        </div>
        <div>
          <h4 class="font-semibold text-sm">User {{ comment.userId.slice(0, 6) }}</h4>
          <p class="text-xs text-gray-600">{{ comment.createdAt | date: 'MMMM yyyy' }}</p>
        </div>
      </div>

      <!-- Stars -->
      <div class="flex gap-1 mb-3">
        <svg *ngFor="let star of [1,2,3,4,5]" class="w-3 h-3" [class.text-gray-300]="star > (comment.score ?? 0)"
          [class.text-gray-900]="star <= (comment.score ?? 0)" fill="currentColor" viewBox="0 0 20 20">
          <path
            d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z" />
        </svg>
      </div>

      <!-- Comment content -->
      <p class="text-sm text-gray-700 leading-relaxed">{{ comment.content }}</p>
      <div class="mt-2">
        <button class="text-xs text-blue-600 underline" (click)="toggleReplyForm(comment.id)">
          Reply
        </button>

        <div *ngIf="replyFormVisible[comment.id]" class="mt-2">
          <textarea [(ngModel)]="replyContent[comment.id]" rows="2" placeholder="Write your reply..."
            class="w-full border p-2 rounded mb-1">
    </textarea>
          <button (click)="submitReply(comment.id)" class="px-3 py-1 bg-gray-200 rounded hover:bg-gray-300 text-sm">
            Send
          </button>
        </div>
      </div>
      <!-- Replies -->
      <div *ngIf="comment.replies?.length" class="mt-4 pl-6 border-l border-gray-200 space-y-4">
        <div *ngFor="let reply of comment.replies">
          <p class="text-sm text-gray-700">{{ reply.content }}</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Show more button -->
  <button class="mt-10 border border-gray-900 px-6 py-3 rounded-lg font-semibold hover:bg-gray-50 transition">
    Afficher les {{ comments.length }} commentaires
  </button>
</div>
