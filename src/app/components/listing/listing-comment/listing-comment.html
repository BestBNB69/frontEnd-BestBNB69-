<div class="mt-12 pt-12 border-t border-gray-200">
  <!-- Header -->
  <div class="flex items-center gap-2 mb-8">
    <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
      <path
        d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"
      />
    </svg>

    <h3 class="text-[22px] font-semibold">
      {{ averageRating }} · {{ reviews.length }} commentaires
    </h3>
  </div>

  <!-- Grille des commentaires -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-x-16 gap-y-10">
    @for (review of reviews; track review.id) {
      <div>
        <div class="flex items-center gap-3 mb-3">
          <img
            [src]="review.user.avatar"
            alt="Utilisateur"
            class="w-10 h-10 rounded-full"
          />

          <div>
            <h4 class="font-semibold text-sm">
              {{ review.user.name }}
            </h4>
            <p class="text-xs text-gray-600">
              {{ review.createdAt | date: 'MMMM yyyy' }}
            </p>
          </div>
        </div>

        <!-- Stars -->
        <div class="flex gap-1 mb-3">
          @for (star of [1,2,3,4,5]; track star) {
            <svg
              class="w-3 h-3"
              [class.text-gray-300]="star > review.rating"
              [class.text-gray-900]="star <= review.rating"
              fill="currentColor"
              viewBox="0 0 20 20"
            >
              <path
                d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"
              />
            </svg>
          }
        </div>

        <p class="text-sm text-gray-700 leading-relaxed">
          {{ review.content }}
        </p>
      </div>
    }
  </div>

  <!-- Bouton -->
  <button
    class="mt-10 border border-gray-900 px-6 py-3 rounded-lg font-semibold hover:bg-gray-50 transition"
  >
    Afficher les {{ reviews.length }} commentaires
  </button>
</div>
