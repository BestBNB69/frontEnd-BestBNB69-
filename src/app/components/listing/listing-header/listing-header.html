<div class="mb-6">
  <h1 class="text-2xl md:text-[26px] font-semibold mb-2">{{ title }}</h1>
  <div class="flex flex-wrap items-center justify-between gap-4">
    <div class="flex items-center gap-4 text-sm">
      <span class="flex items-center gap-1">
              <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                <path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/>
              </svg>
              <span class="font-semibold">{{rating}}</span>
              <span class="text-gray-600">·</span>
              <span class="underline font-semibold">{{totalReviews}}</span>
            </span>
      <span class="text-gray-600">·</span>
      <span class="flex items-center gap-1 underline font-semibold">
              {{ city }}, {{ country }}
            </span>
    </div>
    <div class="flex items-center gap-3">
      <button
        (click)="onShare()"
        class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-gray-100 transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"/>
        </svg>
        <span class="text-sm font-semibold underline">Partager</span>
      </button>

      <button
        (click)="onSave()"
        class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-gray-100 transition">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
        </svg>
        <span class="text-sm font-semibold underline">Enregistrer</span>
      </button>
      <button (click)="goMessages()" class="flex items-center gap-2 px-3 py-2 rounded-lg hover:bg-gray-100 transition">
        <span class="text-sm font-semibold underline">💬 Messages</span>
      </button>
    </div>
  </div>
</div>
