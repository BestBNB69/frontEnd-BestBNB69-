<div class="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm">

  <div
    class="relative w-full max-w-2xl rounded-3xl bg-white shadow-2xl
           max-h-[90vh] flex flex-col">

    <!-- Close -->
    <button
      (click)="close.emit()"
      class="absolute right-6 top-6 z-10 text-gray-400 hover:text-black transition">
      ✕
    </button>

    <!-- Scrollable content -->
    <div class="overflow-y-auto px-8 py-6 space-y-6">

      <!-- Title -->
      <h2 class="text-2xl font-semibold text-gray-900">
        Créer votre annonce
      </h2>

      <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-6">

        <!-- Title -->
        <div class="space-y-1">
          <label class="text-xs font-medium text-gray-500">
            Titre de l’annonce
          </label>
          <input
            formControlName="title"
            placeholder="Appartement cosy au centre"
            class="w-full rounded-xl border border-gray-200 bg-white px-4 py-3 text-sm
                   shadow-sm transition-all
                   focus:border-primary focus:ring-4 focus:ring-primary/20
                   hover:border-gray-300" />
        </div>

        <!-- Description -->
        <div class="space-y-1">
          <label class="text-xs font-medium text-gray-500">
            Description
          </label>
          <textarea
            rows="4"
            formControlName="description"
            placeholder="Décris ton logement, l’ambiance, le quartier…"
            class="w-full resize-none rounded-xl border border-gray-200 bg-white px-4 py-3 text-sm
                   shadow-sm transition-all
                   focus:border-primary focus:ring-4 focus:ring-primary/20
                   hover:border-gray-300"></textarea>
        </div>

        <!-- City / Country -->
        <div class="grid grid-cols-2 gap-4">
          <div class="space-y-1">
            <label class="text-xs font-medium text-gray-500">Ville</label>
            <input
              formControlName="city"
              placeholder="Paris"
              class="w-full rounded-xl border border-gray-200 px-4 py-3 text-sm
                     shadow-sm transition
                     focus:border-primary focus:ring-4 focus:ring-primary/20" />
          </div>

          <div class="space-y-1">
            <label class="text-xs font-medium text-gray-500">Pays</label>
            <input
              formControlName="country"
              placeholder="France"
              class="w-full rounded-xl border border-gray-200 px-4 py-3 text-sm
                     shadow-sm transition
                     focus:border-primary focus:ring-4 focus:ring-primary/20" />
          </div>
        </div>

        <!-- Address -->
        <div class="space-y-1">
          <label class="text-xs font-medium text-gray-500">
            Adresse
          </label>
          <input
            formControlName="address"
            placeholder="12 rue de Rivoli"
            class="w-full rounded-xl border border-gray-200 px-4 py-3 text-sm
                   shadow-sm transition
                   focus:border-primary focus:ring-4 focus:ring-primary/20" />
        </div>

        <!-- Numbers -->
        <div class="grid grid-cols-3 gap-4">

          <div class="rounded-xl border border-gray-200 p-4 shadow-sm hover:shadow-md transition">
            <p class="text-xs text-gray-500 mb-1">Prix / nuit (€)</p>
            <input
              type="number"
              formControlName="price"
              class="w-full bg-transparent text-lg font-semibold focus:outline-none" />
          </div>

          <div class="rounded-xl border border-gray-200 p-4 shadow-sm hover:shadow-md transition">
            <p class="text-xs text-gray-500 mb-1">Voyageurs</p>
            <input
              type="number"
              formControlName="maxGuests"
              class="w-full bg-transparent text-lg font-semibold focus:outline-none" />
          </div>

          <div class="rounded-xl border border-gray-200 p-4 shadow-sm hover:shadow-md transition">
            <p class="text-xs text-gray-500 mb-1">Surface (m²)</p>
            <input
              type="number"
              formControlName="surface"
              class="w-full bg-transparent text-lg font-semibold focus:outline-none" />
          </div>

        </div>

        <!-- Available -->
        <label class="flex cursor-pointer items-center gap-3 rounded-xl border border-gray-200 p-4
                      hover:bg-gray-50 transition">
          <input
            type="checkbox"
            formControlName="available"
            class="h-5 w-5 rounded border-gray-300 text-primary
                   focus:ring-primary/30" />
          <span class="text-sm font-medium text-gray-700">
            Logement disponible
          </span>
        </label>

        <!-- Locations -->
        <div>
          <p class="mb-3 text-sm font-medium text-gray-700">
            Environnement du logement
          </p>

          <div class="flex flex-wrap gap-2">
            @for (loc of locations; track loc.value) {
              <button
                type="button"
                (click)="toggleLocation(loc.value)"
                [class.bg-primary]="form.value.location.includes(loc.value)"
                [class.text-white]="form.value.location.includes(loc.value)"
                class="rounded-full border border-gray-200 px-4 py-2 text-sm transition
                       hover:bg-primary hover:text-white">
                {{ loc.label }}
              </button>
            }
          </div>
        </div>

        <!-- Equipments -->
        <div>
          <p class="mb-3 text-sm font-medium text-gray-700">
            Équipements
          </p>

          <div class="flex flex-wrap gap-2">
            @for (equip of equipments; track equip.value) {
              <button
                type="button"
                (click)="toggleAmenity(equip.value)"
                [class.bg-primary]="form.value.amenities.includes(equip.value)"
                [class.text-white]="form.value.amenities.includes(equip.value)"
                class="rounded-full border border-gray-200 px-4 py-2 text-sm transition
                       hover:bg-primary hover:text-white">
                {{ equip.label }}
              </button>
            }
          </div>
        </div>

        <!-- Images -->
        <div class="space-y-2">
          <p class="text-sm font-medium text-gray-700">Images</p>

          <!-- Preview des images -->
          <div class="flex flex-wrap gap-2 mb-2">
            <ng-container *ngFor="let img of imagePreviews; let i = index">
              <div class="relative w-24 h-24 rounded-lg overflow-hidden border border-gray-200">
                <img [src]="img" class="w-full h-full object-cover" />
                <button
                  type="button"
                  (click)="removeImage(i)"
                  class="absolute top-1 right-1 bg-black/50 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs">
                  ✕
                </button>
              </div>
            </ng-container>
          </div>

          <!-- Input fichier -->
          <input
            type="file"
            multiple
            (change)="onImagesSelected($event)"
            class="w-full text-sm text-gray-500
                   file:mr-4 file:py-2 file:px-4
                   file:rounded-full file:border-0
                   file:text-sm file:font-semibold
                   file:bg-primary file:text-white
                   hover:file:bg-primary/80
                   cursor-pointer" />
        </div>

        <!-- Submit -->
        <button
          type="submit"
          [disabled]="loading"
          class="w-full rounded-xl bg-primary py-4 text-sm font-semibold text-white
                 shadow-lg shadow-primary/30
                 transition-all duration-200
                 hover:scale-[1.02] hover:shadow-xl
                 active:scale-[0.98]
                 disabled:opacity-60">

          @if (!loading) {
            <span>Publier l’annonce</span>
          } @else {
            <span class="animate-pulse">Publication…</span>
          }
        </button>

      </form>
    </div>

  </div>
</div>
